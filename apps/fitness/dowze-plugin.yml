# Manifeste déclaratif du plugin Dowze Fitness (façon VS Code / Forge).
# Source de vérité du contrat ; reflété dans le registre du cœur (migration 0045, table plugin_registry).
slug: fitness
name: Dowze Fitness
subdomain: fitness.dowze.ch
description: La forme physique régulière — des séances inscrites au planning, orchestrées avec l'étude.
manifestVersion: "1"
apiVersion: v1
minCoreVersion: "3.0.0"

# Moindre privilège : requis vs facultatifs (accordés à la demande, révocables).
scopesRequested:
  - profile:read
  - calendar:read
  - calendar:write
scopesOptional:
  - ai:infer # préparer/ingérer les séances via l'IA de Dowze (compose/ingest)
  - health:write # données de forme — consentement explicite SÉPARÉ (RGPD Art. 9)
  - xp:write

# Ce que le plugin apporte au cœur (types d'entrée calendrier).
contributes:
  calendarEntryTypes:
    - type: fitness.workout
      label: Séance
      color: emerald
      icon: activity

# Événements écoutés (réservé — réaction aux entrées créées, replanification).
subscribes: []

# Config utilisateur (validée par le cœur à l'activation).
configSchema:
  type: object
  properties:
    frequencyPerWeek:
      type: integer
      minimum: 1
      maximum: 6
      default: 3
    healthConsent:
      type: boolean
      default: false
